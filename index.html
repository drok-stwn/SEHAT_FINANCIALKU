<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12303a">
<title>Keuangan Keluarga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12303a; --ink2:#4b6670; --line:#d7e2e6; --bg:#eef3f4; --card:#ffffff;
  --brand:#12303a; --ok:#1f8a5b; --warn:#c2410c;
  --c1:#12303a; --c2:#2f7f95; --c3:#d99a1e; --c4:#7a5ea8; --c5:#e0617a;
  --head:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* login */
#login{min-height:100vh;display:grid;place-content:center;padding:24px;gap:18px;max-width:420px;margin:auto}
#login h1{font-size:32px;line-height:1.1}
#login p{color:var(--ink2)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who button{padding:14px 10px;border:1.5px solid var(--line);background:#fff;border-radius:12px;text-align:left;cursor:pointer}
.who button b{display:block;font-family:var(--head);font-size:16px}
.who button span{font-size:13px;color:var(--ink2)}
.who button[aria-pressed=true]{border-color:var(--brand);background:var(--brand);color:#fff}
.who button[aria-pressed=true] span{color:#b9d0d8}
input,select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:48px}
input:focus,select:focus,button:focus-visible{outline:3px solid #2f7f9588;outline-offset:1px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.6}
.err{color:var(--warn);font-size:14px;margin-top:10px;min-height:20px}

/* top */
header{background:var(--brand);color:#fff;padding:18px 0 22px}
header .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
header small{color:#b9d0d8}
.logout{background:none;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.month{margin-top:14px;display:flex;gap:10px;align-items:center}
.month input{background:#ffffff18;border-color:#ffffff40;color:#fff;max-width:190px;min-height:42px;color-scheme:dark}

/* sections */
section{padding-top:18px}
.card{background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--line)}
.card + .card{margin-top:12px}
.total{font-family:var(--head);font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.muted{color:var(--ink2);font-size:13px}
.split{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
.split div b{display:block;font-size:16px}

.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:14px 0 4px;gap:2px}
.stack i{display:block;height:100%}
.pos{padding:14px 0;border-top:1px solid var(--line)}
.pos:first-of-type{border-top:0}
.pos .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pos .top h3{font-size:16px;display:flex;align-items:center;gap:8px}
.pos .top h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pos .pct{font-size:12px;color:var(--ink2);font-weight:600}
.bar{height:8px;background:#e6eef0;border-radius:99px;margin:9px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.nums{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);gap:8px}
.nums b{color:var(--ink)}
.over{color:var(--warn)!important;font-weight:600}

/* forms */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#e1eaed;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:11px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0002}
.formtitle{font-size:20px;margin-bottom:2px}

/* history */
.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .l b{display:block;font-weight:600}
.item .r{text-align:right;white-space:nowrap}
.item .r b{display:block}
.in{color:var(--ok)}
.del{background:none;border:0;color:var(--ink2);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px 0}
.empty{text-align:center;color:var(--ink2);padding:26px 8px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);z-index:5}
nav button{background:none;border:0;padding:10px 4px;font-weight:600;color:var(--ink2);cursor:pointer;border-radius:10px;min-height:48px}
nav button[aria-current=page]{color:var(--brand);background:#e6eef0}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:9}
@media (prefers-reduced-motion:no-preference){.bar i,.stack i{transition:width .5s ease}}
</style>
</head>
<body>

<!-- LOGIN -->
<main id="login">
  <div>
    <h1>Keuangan<br>Keluarga</h1>
    <p style="margin-top:8px">Hendrik Setiawan &amp; Noor Loppa</p>
  </div>
  <div>
    <div class="who" role="group" aria-label="Pilih pengguna">
      <button type="button" data-role="suami" aria-pressed="true"><b>Suami</b><span>Hendrik Setiawan</span></button>
      <button type="button" data-role="istri" aria-pressed="false"><b>Istri</b><span>Noor Loppa</span></button>
    </div>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Masukkan PIN">
    <button class="btn" id="btnLogin">Masuk</button>
    <div class="err" id="loginErr" role="alert"></div>
  </div>
</main>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="wrap">
      <div class="row">
        <div><small>Kepala rumah tangga: Hendrik Setiawan</small><h1 id="hello" style="font-size:22px">Halo</h1></div>
        <button class="logout" id="btnLogout">Keluar</button>
      </div>
      <div class="month"><input type="month" id="month" aria-label="Bulan"><span class="muted" id="sync" style="color:#b9d0d8"></span></div>
    </div>
  </header>

  <div class="wrap">
    <!-- RINGKASAN -->
    <section id="tab-ringkasan">
      <div class="card">
        <div class="muted">Total penghasilan bulan ini (suami + istri)</div>
        <div class="total" id="total">Rp 0</div>
        <div class="split">
          <div><span class="muted">Hendrik (suami)</span><b id="inSuami">Rp 0</b></div>
          <div><span class="muted">Noor (istri)</span><b id="inIstri">Rp 0</b></div>
          <div><span class="muted">Total pengeluaran</span><b id="outAll">Rp 0</b></div>
        </div>
        <div class="stack" id="stack" aria-hidden="true"></div>
        <div class="muted">Pembagian gaji 50 / 20 / 15 / 10 / 5</div>
      </div>
      <div class="card" id="posList"></div>
    </section>

    <!-- CATAT -->
    <section id="tab-catat" class="hidden">
      <div class="seg" role="tablist">
        <button role="tab" id="segOut" aria-selected="true">Pengeluaran</button>
        <button role="tab" id="segIn" aria-selected="false">Pemasukan</button>
      </div>
      <div class="card" style="margin-top:12px">
        <h2 class="formtitle" id="formTitle">Catat pengeluaran</h2>
        <div class="muted" id="formWho"></div>
        <label for="fTanggal">Tanggal</label>
        <input type="date" id="fTanggal">
        <div id="posWrap">
          <label for="fPos">Masuk ke pos</label>
          <select id="fPos"></select>
        </div>
        <label for="fKet" id="lblKet">Keterangan</label>
        <input id="fKet" type="text" placeholder="Contoh: belanja bulanan" maxlength="80">
        <label for="fJumlah">Jumlah (Rp)</label>
        <input id="fJumlah" type="text" inputmode="numeric" placeholder="0">
        <button class="btn" id="btnSave">Simpan</button>
        <div class="err" id="formErr" role="alert"></div>
      </div>
    </section>

    <!-- RIWAYAT -->
    <section id="tab-riwayat" class="hidden">
      <div class="card" id="history"></div>
    </section>
  </div>

  <nav>
    <button data-tab="ringkasan" aria-current="page">Ringkasan</button>
    <button data-tab="catat">Catat</button>
    <button data-tab="riwayat">Riwayat</button>
  </nav>
</div>
<div id="toast" class="hidden" role="status"></div>

<script>
/* ====== PENGATURAN: tempel URL Web App dari Apps Script di sini ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxbs0txasgTrYS6xCG8DFdFHKRrDfuhBytLfHWqI9Ki2xQo-H9l797T7133D4mVTlKOlQ/exec';
/* ===================================================================== */

const POS = [
  {k:'Kebutuhan Pokok', p:.50, c:'var(--c1)'},
  {k:'Dana Investasi',  p:.20, c:'var(--c2)'},
  {k:'Dana Darurat',    p:.15, c:'var(--c3)'},
  {k:'Dana Orangtua',   p:.10, c:'var(--c4)'},
  {k:'Dana Jalan-jalan',p:.05, c:'var(--c5)'}
];
const $ = s => document.querySelector(s);
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

let role = localStorage.getItem('kk_role') || 'suami';
let pin  = localStorage.getItem('kk_pin') || '';
let nama = '';
let data = {pemasukan:[], pengeluaran:[]};
let mode = 'out';

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2200); }

async function api(params){
  const r = await fetch(API_URL + '?' + new URLSearchParams(params));
  return r.json();
}
async function post(body){
  const r = await fetch(API_URL, {method:'POST', body: JSON.stringify({role, pin, ...body})});
  return r.json();
}

/* ---- login ---- */
document.querySelectorAll('.who button').forEach(b => {
  b.setAttribute('aria-pressed', b.dataset.role === role);
  b.onclick = () => { role = b.dataset.role; document.querySelectorAll('.who button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
});
async function login(){
  $('#loginErr').textContent = '';
  pin = $('#pin').value.trim();
  if(!pin){ $('#loginErr').textContent = 'Masukkan PIN dulu.'; return; }
  if(API_URL.startsWith('GANTI')){ $('#loginErr').textContent = 'URL Apps Script belum diisi di index.html.'; return; }
  $('#btnLogin').disabled = true;
  try{
    const res = await api({action:'list', role, pin});
    if(!res.ok){ $('#loginErr').textContent = res.error || 'Gagal masuk.'; return; }
    localStorage.setItem('kk_role', role); localStorage.setItem('kk_pin', pin);
    nama = res.nama; data = res; showApp();
  }catch(e){ $('#loginErr').textContent = 'Tidak bisa terhubung. Cek internet dan URL Apps Script.'; }
  finally{ $('#btnLogin').disabled = false; }
}
$('#btnLogin').onclick = login;
$('#pin').onkeydown = e => { if(e.key === 'Enter') login(); };
$('#btnLogout').onclick = () => { localStorage.removeItem('kk_pin'); location.reload(); };

function showApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#hello').textContent = 'Halo, ' + nama.split(' ')[0];
  $('#formWho').textContent = (role==='suami' ? 'Input Suami' : 'Input Istri') + ' · ' + nama;
  $('#fTanggal').value = today();
  $('#month').value = today().slice(0,7);
  $('#fPos').innerHTML = POS.map(p => `<option>${p.k}</option>`).join('');
  render();
}

async function refresh(){
  $('#sync').textContent = 'menyegarkan…';
  try{ const res = await api({action:'list', role, pin}); if(res.ok){ data = res; render(); } }
  catch(e){ toast('Gagal menyegarkan data'); }
  $('#sync').textContent = '';
}

/* ---- render ---- */
function render(){
  const m = $('#month').value;
  const inn = data.pemasukan.filter(r => r.Tanggal.startsWith(m));
  const out = data.pengeluaran.filter(r => r.Tanggal.startsWith(m));
  const sum = a => a.reduce((s,r) => s + r.Jumlah, 0);
  const total = sum(inn);
  $('#total').textContent = rp(total);
  $('#inSuami').textContent = rp(sum(inn.filter(r => r.Oleh === 'Hendrik Setiawan')));
  $('#inIstri').textContent = rp(sum(inn.filter(r => r.Oleh === 'Noor Loppa')));
  $('#outAll').textContent = rp(sum(out));
  $('#stack').innerHTML = POS.map(p => `<i style="width:${p.p*100}%;background:${p.c}"></i>`).join('');

  $('#posList').innerHTML = POS.map(p => {
    const alok = total * p.p;
    const used = sum(out.filter(r => r.Pos === p.k));
    const sisa = alok - used;
    const pct = alok > 0 ? Math.min(100, used / alok * 100) : (used > 0 ? 100 : 0);
    const over = sisa < 0;
    return `<div class="pos">
      <div class="top"><h3><i style="background:${p.c}"></i>${p.k}</h3><span class="pct">${p.p*100}% · ${rp(alok)}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${over ? 'var(--warn)' : p.c}"></i></div>
      <div class="nums"><span>Terpakai <b>${rp(used)}</b></span>
      <span class="${over?'over':''}">${over ? 'Lebih ' + rp(-sisa) : 'Sisa <b>' + rp(sisa) + '</b>'}</span></div>
    </div>`;
  }).join('');

  const rows = [
    ...inn.map(r => ({...r, t:'in'})),
    ...out.map(r => ({...r, t:'out'}))
  ].sort((a,b) => b.Tanggal.localeCompare(a.Tanggal));
  $('#history').innerHTML = rows.length ? rows.map(r => `
    <div class="item">
      <div class="l"><b>${esc(r.Keterangan) || (r.t==='in' ? 'Pemasukan' : esc(r.Pos))}</b>
        <span class="muted">${r.Tanggal} · ${esc(r.Oleh.split(' ')[0])}${r.t==='out' ? ' · ' + esc(r.Pos) : ''}</span></div>
      <div class="r"><b class="${r.t==='in'?'in':''}">${r.t==='in'?'+':'−'} ${rp(r.Jumlah)}</b>
        <button class="del" data-t="${r.t}" data-id="${esc(r.ID)}">Hapus</button></div>
    </div>`).join('') : '<div class="empty">Belum ada catatan di bulan ini.</div>';
}
$('#month').onchange = render;

$('#history').onclick = async e => {
  const b = e.target.closest('.del'); if(!b) return;
  if(!confirm('Hapus catatan ini?')) return;
  const res = await post({action:'delete', sheet: b.dataset.t==='in' ? 'pemasukan' : 'pengeluaran', id: b.dataset.id});
  if(res.ok){ toast('Catatan dihapus'); refresh(); } else toast(res.error || 'Gagal menghapus');
};

/* ---- tabs ---- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.removeAttribute('aria-current'));
  b.setAttribute('aria-current','page');
  ['ringkasan','catat','riwayat'].forEach(t => $('#tab-'+t).classList.toggle('hidden', t !== b.dataset.tab));
  refresh();
});

/* ---- form ---- */
function setMode(m){
  mode = m;
  $('#segOut').setAttribute('aria-selected', m==='out'); $('#segIn').setAttribute('aria-selected', m==='in');
  $('#formTitle').textContent = m==='out' ? 'Catat pengeluaran' : 'Catat pemasukan';
  $('#posWrap').classList.toggle('hidden', m==='in');
  $('#fKet').placeholder = m==='out' ? 'Contoh: belanja bulanan' : 'Contoh: gaji bulan ini';
}
$('#segOut').onclick = () => setMode('out'); $('#segIn').onclick = () => setMode('in');
$('#fJumlah').oninput = e => { const d = e.target.value.replace(/\D/g,''); e.target.value = d ? Number(d).toLocaleString('id-ID') : ''; };

$('#btnSave').onclick = async () => {
  $('#formErr').textContent = '';
  const jumlah = Number($('#fJumlah').value.replace(/\D/g,''));
  const tanggal = $('#fTanggal').value;
  if(!tanggal || !(jumlah > 0)){ $('#formErr').textContent = 'Isi tanggal dan jumlah.'; return; }
  $('#btnSave').disabled = true;
  try{
    const res = await post({action:'add', sheet: mode==='in' ? 'pemasukan' : 'pengeluaran',
      tanggal, jumlah, keterangan: $('#fKet').value.trim(), pos: $('#fPos').value});
    if(!res.ok){ $('#formErr').textContent = res.error || 'Gagal menyimpan.'; return; }
    $('#fKet').value = ''; $('#fJumlah').value = '';
    toast(mode==='in' ? 'Pemasukan tersimpan' : 'Pengeluaran tersimpan');
    $('#month').value = tanggal.slice(0,7);
    await refresh();
  }catch(e){ $('#formErr').textContent = 'Tidak bisa terhubung. Coba lagi.'; }
  finally{ $('#btnSave').disabled = false; }
};

/* ---- auto login jika PIN tersimpan ---- */
if(pin && !API_URL.startsWith('GANTI')){
  api({action:'list', role, pin}).then(res => { if(res.ok){ nama = res.nama; data = res; showApp(); } }).catch(()=>{});
}
</script>
</body>
</html>
